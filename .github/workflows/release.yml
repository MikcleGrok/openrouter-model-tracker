name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned SBOM tool
        run: go install github.com/anchore/syft/cmd/syft@v1.18.1

      - name: Install pinned cosign (release provenance signing)
        run: go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.3

      - name: Install pinned govulncheck (dependency vulnerability scan)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Install pinned osv-scanner (dependency vulnerability scan)
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0

      - name: Build the release manifest (binary, SBOM, checksum) and dependency evidence
        run: make security dependency-check secrets-check release-manifest

      - name: Sign release manifest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.OPENROUTER_TRACKER_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.OPENROUTER_TRACKER_COSIGN_PASSWORD }}
        run: make sign

      - name: Attest release manifest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.OPENROUTER_TRACKER_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.OPENROUTER_TRACKER_COSIGN_PASSWORD }}
        run: make attest

      - name: Verify signed release provenance
        run: make verify-provenance

      - name: Render release notes from CHANGELOG.md
        run: make whats-new > release-notes.md

      - name: Publish GitHub Release with signed provenance evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            bin/openrouter \
            .release/release-manifest.json \
            .release/release-manifest.json.sig.bundle.json \
            .release/release-manifest.json.att.bundle.json \
            .release/sbom.spdx.json \
            .release/dependency-evidence.json \
            .release/published-evidence.json \
            .release/openrouter.sha256
