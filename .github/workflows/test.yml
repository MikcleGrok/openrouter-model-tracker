name: Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned vulnerability and SBOM tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0
          go install github.com/anchore/syft/cmd/syft@v1.18.1
      - run: make fmt-check
      - run: make test-unit
      - run: make vet
      - run: make test-acceptance
      - name: Run security and supply-chain gates
        run: make security dependency-check secrets-check sbom check-docs
