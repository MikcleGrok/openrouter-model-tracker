caveats:
  - >-
    Цены на OpenRouter меняются часто (неделями, иногда днями) — перед тем как тратить деньги,
    сверьтесь напрямую на https://openrouter.ai/models.
  - >-
    **Часть моделей в подборке не имеет оценки SWE-bench Verified для того самого продукта,
    который продаётся на OpenRouter** — у них в колонке «Качество/цена» стоит `н/д`, они стоят
    в конце таблицы своего тира и не участвуют ни в ранжировании, ни в отборе фаворитов.
  - >-
    Бенчмарки сильно зависят от скаффолда/harness, которым их гоняли, а не только от модели —
    расхождения в 15-25 процентных пунктов для одной и той же модели между разными лидербордами
    не редкость.
  - >-
    Значительная часть оценок в таблицах — **вендорские** (помечено «только вендор»).
    Независимо подтверждены только те строки, число которых пришло с vals.ai (источник
    swebench.com в код подключён, но в model-map.tsv пока нет ни одной записи swebench=,
    поэтому он сегодня не даёт ни одной строки).
  - >-
    SWE-bench Verified и подобные бенчмарки не идеально предсказывают реальное качество
    в конкретном воркфлоу — протестируйте 1-2 кандидата на своих задачах перед переключением.
  - >-
    OpenRouter обычно даёт скидку на закешированный контекст (порядка 60-90% по большинству
    моделей), но точный процент варьируется по провайдеру.
  - >-
    В таблицах всюду **типовая цена каталога** OpenRouter (`/api/v1/models`), а не самый
    дешёвый маршрут конкретного провайдера; актуальный список промо-цен —
    https://openrouter.ai/collections/discounted-models.

favorite_reasons:
  opus:
    openai/gpt-5.6-luna: >-
      Лучшее соотношение цена/качество в Opus-тире: 93.0% SWE-bench Verified при цене
      в разы ниже, чем у остальных строк тира, оценка независимая (vals.ai).
    openai/gpt-5.6-sol: >-
      Заметно хуже по цена/качество, чем Luna, но ближе всего к Opus 5 по сырой оценке.
      METR фиксировал эксплуатацию багов eval'ов у Sol в **другом** бенчмарке, а не
      в SWE-bench Verified — но общая осторожность к её eval-результатам сохраняется.
  sonnet:
    minimax/minimax-m3: >-
      Топ-1 по цена/качество в Sonnet-тире при цене в 10-12 раз ниже полного прайса
      Sonnet 5. Оговорка: 80.5% — только по блогу вендора, на независимых лидербордах
      модели нет.
    meta/muse-spark-1.1: >-
      Следующая по «качество/цена» среди строк с оценкой именно этого продукта; её 77.4%
      тоже вендорские, но относятся к ней самой.
  haiku:
    deepseek/deepseek-v4-flash: >-
      Лучшая цена/качество во всём тире <≈ Claude Haiku 4.5: SWE-V 73.7–79.0% (вендорские
      цифры по двум вариантам линейки) при цене вне конкуренции с остальными строками
      тира — независимо от того, какая из двух оценок точнее.
    tencent/hy3: >-
      Следующая по цена/качество среди строк с самоотчётной, но правдоподобной оценкой
      (78.0%, только вендор, достоверность низкая); уже заметно используется в проде —
      #2 по объёму трафика и #1 по числу tool-calls в категории "coding" на OpenRouter.
  free:
    poolside/laguna-xs-2.1:free: >-
      Впереди по сырой оценке (70.9% против 70.4% у Nemotron 3 Ultra), но это одиночная
      точка по данным самого вендора (Poolside прямо пишет в карточке, что публикует
      «official scores» из своих релизных постов) — не подтверждена независимо. Контекст
      меньше, чем у Nemotron 3 Ultra (262K против 1M).
    nvidia/nemotron-3-ultra-550b-a55b:free: >-
      Лимиты бесплатного тира одинаковы для всех `:free`-моделей, так что отбор фактически
      сводится к качеству и близким числам. По сырой оценке немного отстаёт от Laguna XS 2.1
      (70.4% против 70.9%), но диапазон получен на 5 харнессах (устойчивее одиночной
      самоотчётной точки), а контекст — 1M против 262K у Laguna: близкий, хорошо
      обоснованный второй выбор.

models:
  # (1) Модель с ЖИВОЙ оценкой с источника: блока score: нет — число придёт из vals.ai.
  openai/gpt-5.6-luna:
    display: GPT-5.6 Luna
    owner: OpenAI (C)
    open_weights: "нет"
    note: >-
      Оценка независимая, vals.ai. Сейчас лучшая цена/качество в Opus-тире.

  openai/gpt-5.6-sol:
    display: GPT-5.6 Sol
    owner: OpenAI (C)
    open_weights: "нет"
    note: >-
      Ближе всего к Opus 5 (97.0%) по сырой оценке, 96.2% подтверждены на vals.ai. Оговорка
      про METR уточнена: его находка про эксплуатацию багов eval'ов относится к **другому**
      бенчмарку — собственному agentic time-horizon eval'у METR на харнессе Terminal-Bench
      2.1/ReAct, где у Sol самый высокий когда-либо измеренный уровень «читинга»; ни один
      отчёт не связывает это конкретно с числом 96.2% SWE-bench Verified. Отдельный аудит
      UC Berkeley RDI (апрель 2026, до выхода Sol) показал, что бенчмарки типа SWE-bench
      Verified в принципе поддаются накрутке харнесс-трюком — это не про Sol персонально.
      Общая осторожность к eval-результатам Sol сохраняется.

  # (2) Модель с ВЕНДОРСКОЙ оценкой, участвующей в ранжировании: score: с rankable: true.
  minimax/minimax-m3:
    display: MiniMax M3
    owner: MiniMax (н/д)
    open_weights: "**да** (кастомная лицензия, коммерч. ограничения)"
    note: >-
      Лучшая цена/качество в этом тире. Оценка — только из блога вендора (minimax.io);
      на независимых лидербордах модели нет, достоверность низкая. У GMICloud есть
      маршрут дешевле типовой цены каталога.
    score:
      label: "80.5% (только вендор)"
      value: 80.5
      rankable: true
      source: "https://minimax.io/"

  meta/muse-spark-1.1:
    display: Meta Muse Spark 1.1
    owner: Meta (D+)
    open_weights: "нет"
    note: >-
      Флагман Meta вместо бренда Llama; 77.4% — заявка самой Meta, независимого
      подтверждения нет. Цифру SWE-bench Verified Hard 42.9% **не удалось проверить
      на 2026-07-30** (исходный PDF не читается, часть обзоров её вообще не упоминает) —
      оставлена с прошлой версии; сторонние обзоры дают только SWE-bench Pro 52.4–61.5%
      и Terminal-Bench.
    score:
      label: "77.4% (только вендор)"
      value: 77.4
      rankable: true
      source: "https://ai.meta.com/"

  qwen/qwen3.7-max:
    display: Qwen3.7 Max
    owner: Alibaba Cloud / Qwen (D−)
    open_weights: "нет"
    note: >-
      80.4% держится только на вендорских и около-вендорских публикациях, независимого
      лидерборда нет. Alibaba анонсировала превью Qwen 3.8-Max (2026-07-19); к 2026-07-30
      у превью появились API и цена ($0.17/$0.51 за M — «10% от стандартной»), но
      SWE-bench Verified не публиковали и продукта на OpenRouter нет — рано менять
      рекомендацию.
    score:
      label: "80.4% (только вендор)"
      value: 80.4
      rankable: true
      source: "https://qwenlm.github.io/"

  # Живая оценка с vals.ai (форма 1) — vals= в model-map.tsv, блока score: нет.
  x-ai/grok-4.5:
    display: Grok 4.5
    owner: xAI (F)
    open_weights: "нет"
    note: >-
      86.6% подтверждены независимо (vals.ai), высокая достоверность. Реально близко
      к Opus по агентным задачам (SWE-bench Pro 64.7% — другая метрика; лидирует
      в SWE Marathon); свыше 200K токенов — $4/$12, кэш-чтение $0.60.

  mistralai/mistral-medium-3-5:
    display: Mistral Medium 3.5
    owner: Mistral AI (F)
    open_weights: "**да** (модиф. MIT, лицензия нужна при выручке >$20M/мес)"
    note: >-
      Теперь основная рекомендация Mistral для агентного кодинга — заменила Devstral 2
      по умолчанию в их Vibe CLI. 77.6% — из анонса самой Mistral (в пересказе прессы),
      независимого подтверждения нет.
    score:
      label: "77.6% (только вендор)"
      value: 77.6
      rankable: true
      source: "https://mistral.ai/"

  google/gemini-3.1-pro-preview:
    display: Gemini 3.1 Pro Preview
    owner: Google DeepMind (C)
    open_weights: "нет"
    note: >-
      Всё ещё preview — стабильного Gemini Pro на замену (Gemini 3.5 Pro) по-прежнему
      нет: Google подтвердила 2026-07-21, что релиз не готов (цель 17 июля сорвана),
      и выпускает вместо него Flash-модели.
    score:
      label: "80.6%"
      value: 80.6
      rankable: true
      source: "https://deepmind.google/"

  # Живая оценка с vals.ai (форма 1) — vals= в model-map.tsv, блока score: нет.
  moonshotai/kimi-k3:
    display: Kimi K3
    owner: Moonshot AI (н/д)
    open_weights: "**да** (кастом. лицензия, свободно до 100M MAU)"
    note: >-
      **Основное число изменено в этом обновлении**: 93.4% взяты с живого независимого
      лидерборда vals.ai (ранг #4, обновление 2026-07-22, продукт совпадает точно).
      Прошлая версия документа показывала 76.8%, но источник этого числа **не удалось
      отследить на 2026-07-30** — нашлись только другие метрики (Toolathlon-Verified
      76.5%, FrontierSWE 81.2%, DeepSWE 67.5%, SWE Marathon 42.0%, Program Bench 77.8%),
      ни одна из них не «76.8% SWE-bench Verified». По правилу «независимое измерение
      приоритетнее вендорского/неотслеживаемого» в ранжирование пошло 93.4% (качество/цена
      15.6 вместо прежних 12.8); 76.8% сохранено здесь как альтернативная цифра
      с неподтверждённым источником. Расхождение такого размера у этой модели правдоподобно
      объясняется скаффолдом: на Terminal-Bench 2.1 у неё же 88.3% на харнессе Moonshot
      против 80.9% на прогоне vals.ai. По сырой оценке 93.4% модель уже на уровне тира
      >≈ Claude Opus 5 (у Luna — 93.0%), но оценка спорная, а цена равна полному прайсу Sonnet 5
      без скидки — строка оставлена в этом тире; если 93.4% подтвердится вторым независимым
      источником, её следует перенести в >≈ Claude Opus 5.

  # (3) Модель, чьё число измерено на ДРУГОМ варианте: score: отсутствует,
  #     а no_score_reason объясняет, почему строка не ранжируется.
  deepseek/deepseek-v4-pro:
    display: DeepSeek V4 Pro
    owner: DeepSeek (F)
    open_weights: "**да, MIT**"
    no_score_reason: "н/д (оценка не для этого варианта)"
    note: >-
      Заявленная оценка ~80.6% измерена для варианта «V4-Pro-Max», которого на OpenRouter
      не существует — это не тот продукт, что продаётся под `deepseek/deepseek-v4-pro`.
      Для реального продукта независимой оценки SWE-bench Verified нет, поэтому строка
