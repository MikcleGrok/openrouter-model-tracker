updated_note: >-
  цены и контекст получены из каталога OpenRouter (/api/v1/models), оценки —
  с vals.ai по ручной карте model-map.tsv (источник swebench.com подключён,
  но пока не даёт ни одной строки — в карте нет ни одной записи swebench=);
  остальные числа заданы вручную в notes.yaml и помечены как вендорские

sections:
  favorites_intro: >-
    Один лучший вариант на каждый уровень качества Claude, отобранный по единому критерию:
    платные модели ранжируются по метрике «Качество/цена» — отношению SWE-bench Verified (%)
    к смешанной цене 3:1 вход:выход. У бесплатных моделей цена $0/$0 у всех, поэтому
    «качество/цена» не определена — они ранжируются по качеству. Строки, у которых оценка
    измерена не на том продукте, что продаётся под этим slug'ом (или у которых оценки по
    SWE-bench Verified нет вовсе), в отборе фаворитов **не участвуют**.

  safety_intro: >-
    Рейтинг безопасности ниже — это не оценка конкретной модели, а независимая оценка
    компании-разработчика в целом (её risk-практик, safety-фреймворков, прозрачности).
    Источник — Future of Life Institute, **«AI Safety Index — Summer 2026»**
    (опубликован 2026-07-07, futureoflife.org/ai-safety-index-summer-2026, шкала 0–4.0
    с буквенным грейдом).

  saferai: >-
    Второй, более узкий источник для сверки — SaferAI Frontier Risk Management Tracker
    (tracker.safer-ai.org, только 12 компаний, подписавших сеульские safety-обязательства):
    Anthropic 35% (#1), OpenAI 34%, Meta 33%, Google DeepMind 20%, xAI 18%, Cohere 8%.
    Оба источника оценивают компанию в целом, а не конкретную модель — прямого соответствия
    «модель → грейд» нет.

  open_weights: >-
    **Открытые веса (open-source/open-weight) — в таблицах ниже выделены полужирным
    в колонке «Открытые веса».** Полностью или частично открыты (с ограничениями по
    выручке/MAU в лицензии): все модели DeepSeek (MIT), Qwen3 Coder Next и Qwen3 Coder 480B
    (Apache 2.0 — но не Qwen3.7 Max), обе Xiaomi MiMo-V2.5 (MIT), Tencent Hy3 (Apache 2.0),
    MiniMax M3 (кастомная лицензия), GLM-5.2 (MIT), вся линейка Kimi (модифицированная MIT),
    Llama 4 Maverick (Llama 4 Community License), большая часть линейки Mistral — Devstral 2,
    Medium 3.5, Large 3 (но не Codestral 2508). Полностью закрытые: всё OpenAI, весь Gemini,
    Grok 4.5, Meta Muse Spark 1.1, обе модели KAT-Coder. Статус весов Meituan LongCat 2.0
    подтвердить не удалось.

  tiers_intro: >-
    Категории — по примерному уровню качества относительно Claude (см. таблицу фаворитов выше).
    **Качество/цена** = баллы SWE-bench Verified (%), делённые на смешанную цену 3:1 вход:выход, $/M.
    Строки, чья единственная доступная оценка измерена на другом продукте/варианте, и строки,
    у которых SWE-bench Verified не публиковали вовсе, стоят **в конце** таблицы своего тира,
    отсортированы по смешанной цене и в ранжировании не участвуют. Цены — **типовая цена каталога
    OpenRouter**, а не самый дешёвый маршрут конкретного провайдера.

  tokens10_intro: >-
    Смешанное соотношение 3:1 (вход:выход) — грубое приближение к типичной нагрузке
    кодинг-агента, а не гарантия реальных трат. Набор моделей и порядок строк здесь ровно те же,
    что в разделе выше.

  free_intro: >-
    Модели с ценой $0/$0 (не путать с дешёвыми платными) — из каталога OpenRouter
    (`pricing.prompt == "0"` и `pricing.completion == "0"`). Лучшая по качеству вынесена
    в «Фавориты по категориям» выше. Две оговорки: **все оценки здесь вендорские** — ни одна
    бесплатная модель в подборке не имеет независимого прогона SWE-bench Verified; и **каталог
    бесплатных моделей волатилен** — проверяйте наличие slug'а перед тем, как на него закладываться.

  free_terms: >-
    Практические оговорки для всех `:free`-моделей: rate-limit 20 запросов/мин; 50 запросов/день
    на аккаунте с пополнениями меньше $10 за всё время, 1000/день после разового пополнения от $10
    (openrouter.ai/docs/api-reference/limits). Часть провайдеров бесплатных эндпоинтов может
    использовать запросы для обучения; управляется это настройками приватности аккаунта —
    openrouter.ai/settings/privacy.

fable_verdict: >-
  Ни одна проверенная модель независимо не подтверждает Fable-уровень: на лидерборде vals.ai
  сам Claude Fable 5 держит 95.0% SWE-bench Verified, а лучший сторонний результат в подборке
  относится к Opus-уровню.

claude_note: >-
